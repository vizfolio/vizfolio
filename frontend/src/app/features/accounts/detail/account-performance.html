<div class="perf">
  <div class="range">
    <label class="range-field">
      <span class="range-label">From</span>
      <input type="date" [value]="from()" (change)="onFrom($event)" />
    </label>
    <label class="range-field">
      <span class="range-label">To</span>
      <input type="date" [value]="to()" (change)="onTo($event)" />
    </label>
    <span class="range-note">Leave blank to use the account's full history.</span>
  </div>

  @switch (status()) {
    @case ('loading') {
      <p class="loading" role="status">Calculating performance…</p>
    }
    @case ('error') {
      <p class="error" role="alert">Couldn't load performance for this account.</p>
    }
    @default {
      @if (performance(); as p) {
        <app-performance-summary [performance]="p" />
      }
    }
  }
</div>
