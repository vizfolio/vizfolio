<section class="dashboard">
  <header class="dash-header">
    <div>
      <h1>Dashboard</h1>
      @if (portfolioName(); as name) {
        <p class="dash-subtitle">{{ name }}</p>
      }
    </div>
  </header>

  @if (status() === 'loading') {
    <p class="dash-loading" role="status">Loading portfolio data…</p>
  } @else {
    @if (notice(); as message) {
      <p class="dash-notice" role="status">{{ message }}</p>
    }

    <div class="stat-grid">
      <app-stat-card
        label="Portfolio value"
        [value]="valueLabel()"
        [incomplete]="valueIncomplete()"
      />
      <app-stat-card label="Deposits" [value]="depositsLabel()" trend="up" />
      <app-stat-card label="Withdrawals" [value]="withdrawalsLabel()" trend="down" />
      <app-stat-card
        label="Net contributions"
        [value]="netLabel()"
        [trend]="netTrend()"
      />
      <app-stat-card
        label="Return (time-weighted)"
        [value]="returnLabel()"
        [trend]="returnTrend()"
      />
    </div>

    <div class="chart-card">
      <div class="chart-head">
        <h2>Performance</h2>
        <span class="chart-note">Illustrative — real time series coming soon</span>
      </div>
      <div class="chart-body">
        <app-perf-chart
          [labels]="chartLabels()"
          [datasets]="chartDatasets()"
          ariaLabel="Portfolio value with deposits and withdrawals over time"
        />
      </div>
    </div>
  }
</section>
