<article class="stat-card">
  <div class="stat-head">
    <span class="stat-label">{{ label() }}</span>
    <ng-content select="[statBadge]" />
  </div>

  <p class="stat-value">
    {{ value() }}
    @if (unit(); as u) {
      <span class="stat-unit">{{ u }}</span>
    }
  </p>

  @if (delta(); as d) {
    <p class="stat-delta" [class]="'trend-' + trend()">{{ d }}</p>
  }

  @if (hint(); as h) {
    <p class="stat-hint">{{ h }}</p>
  }
</article>
