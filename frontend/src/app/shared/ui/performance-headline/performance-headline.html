@let p = performance();
<div class="stat-grid">
  <app-stat-card [label]="balanceLabel()" [value]="money(p.endingBalance.value)" [delta]="balanceDetail()">
    @let b = balanceStatus();
    <app-completeness-badge
      statBadge
      [complete]="b.isComplete"
      [missing]="b.holdingsMissingSnapshot"
      [missingDetails]="b.missing ?? []"
      [pending]="pendingPrices(b)"
    />
  </app-stat-card>
  @let mwrFigure = mwr();
  <app-stat-card
    [label]="yourReturnLabel"
    [value]="mwrFigure.value"
    [unit]="mwrFigure.unit"
    [delta]="mwrFigure.detail"
    [hint]="yourReturnHint"
    [featured]="true"
  />
  @let twrFigure = twr();
  <app-stat-card
    [label]="investmentReturnLabel"
    [value]="twrFigure.value"
    [unit]="twrFigure.unit"
    [delta]="twrFigure.detail"
    [hint]="investmentReturnHint"
  />
  <app-stat-card
    label="Net contributions"
    [value]="money(p.contributions.net)"
    [delta]="contributionsDetail()"
  />
</div>

@if (missingNote(); as note) {
  <p class="missing-note" role="note">
    {{ note }}
    @if (healthLink(); as link) {
      <a [routerLink]="link" [queryParams]="healthQuery()">Review data health</a>
    }
  </p>
}
